name: CI

on:
  push:
    branches: [main, feat/read-only-api-live-dashboard]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check configured Ethereum RPC (bounded)
        if: ${{ env.ETHEREUM_RPC_URL != '' }}
        run: npm run rpc:check
      - name: Run bounded Aave V3 read-only scan
        if: ${{ env.ETHEREUM_RPC_URL != '' }}
        run: npm run aave:scan
        env:
          AAVE_SCAN_LOOKBACK_BLOCKS: 100
