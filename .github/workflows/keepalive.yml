name: Keep VaultHunter awake

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://vaulthunter-core.onrender.com/healthz"
          for attempt in 1 2 3 4 5; do
            response="$(curl --silent --show-error --max-time 30 "$URL" || true)"
            if grep -q '"ok":true' <<< "$response"; then
              echo "$response"
              echo "VaultHunter health endpoint responded successfully."
              exit 0
            fi
            echo "Health check attempt $attempt did not return the healthy JSON response; retrying."
            sleep 10
          done
          echo "VaultHunter did not become healthy after five attempts."
          exit 1
